# =====================================================================
# CẤU HÌNH MÔI TRƯỜNG DOCKER CONTAINER (SPRING PROFILE: docker)
# =====================================================================

# ===== Microsoft SQL Server 2022 Container =====
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://sqlserver:1433;databaseName=bookstore_db;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Password123@}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# HikariCP Connection Pool tối ưu cho môi trường container
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000

# ===== Cloudinary (Quản lý ảnh sách, avatar, bìa shop) =====
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:demo-cloud}
cloudinary.api-key=${CLOUDINARY_API_KEY:1234567890}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:abcdef123456}

# ===== JWT Secret (Khóa ký xác thực Token) =====
jwt.secret=${JWT_SECRET:thay-bang-chuoi-bi-mat-dai-it-nhat-32-ky-tu-1234567890}

# ===== Gmail SMTP (Gửi mã OTP qua email) =====
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:demo@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:demopassword}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===== VNPAY Gateway Sandbox =====
vnpay.tmn-code=${VNPAY_TMN_CODE:DEMOTMN1}
vnpay.hash-secret=${VNPAY_HASH_SECRET:DEMOHASHSECRET1234567890}
vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8080/payment/vnpay-return}
