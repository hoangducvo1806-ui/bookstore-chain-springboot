<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>Quyền Truy Cập Bị Giới Hạn - Chuỗi Sách Cũ</title>
</head>
<body>
<div th:fragment="content">
    <div class="container py-5 my-5 text-center">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white">
                    <div class="mb-4">
                        <span class="badge bg-danger-subtle text-danger p-3 rounded-circle" style="font-size: 2.5rem;">
                            <i class="bi bi-shield-lock-fill"></i>
                        </span>
                    </div>
                    <h3 class="fw-bold mb-3 text-white">Quyền Truy Cập Bị Giới Hạn (403)</h3>
                    <p class="text-secondary mb-4" style="line-height: 1.6;">
                        Tài khoản hiện tại của bạn không có đủ thẩm quyền để truy cập vào khu vực này.<br>
                        Trang bạn đang mở yêu cầu quyền <strong class="text-warning">Chủ cửa hàng (Vendor)</strong> hoặc <strong class="text-danger">Quản trị viên (Admin)</strong>.
                    </p>
                    <div class="d-flex gap-2 justify-content-center flex-wrap">
                        <a th:href="@{/}" class="btn btn-outline-light px-4 py-2 rounded-pill">
                            <i class="bi bi-house me-1"></i> Quay về Trang chủ
                        </a>
                        <a th:href="@{/logout}" class="btn btn-danger px-4 py-2 rounded-pill fw-semibold">
                            <i class="bi bi-box-arrow-right me-1"></i> Đăng xuất & Đổi tài khoản
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
