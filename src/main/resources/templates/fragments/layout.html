<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">Chuỗi Cửa Hàng Sách Cũ</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bookly & Vendor CSS -->
    <link rel="stylesheet" type="text/css" th:href="@{/css/vendor.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Google Fonts hỗ trợ 100% Tiếng Việt không bị lỗi font chữ / nhảy font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Nunito:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bs-secondary-color: #6c757d !important;
            --bs-body-color: #2b2b2b !important;
        }

        /* Khắc phục triệt để lỗi font chữ tiếng Việt */
        body, button, input, select, textarea, h1, h2, h3, h4, h5, h6, .navbar, .nav-link, p, span, a, label {
            font-family: 'Plus Jakarta Sans', 'Nunito', 'Segoe UI', Roboto, -apple-system, BlinkMacSystemFont, Arial, sans-serif !important;
        }

        /* Hủy bỏ CSS capitalize tự động làm hỏng dấu tiếng Việt */
        h1, h2, h3, h4, h5, h6 {
            text-transform: none !important;
            letter-spacing: normal !important;
        }

        /* Khắc phục màu chữ text-muted bị mờ nhạt */
        .text-muted {
            color: #6c757d !important;
        }

        /* Background màu đen sang trọng cho thanh Top-Info */
        .top-info {
            background-color: #111111 !important;
            color: #ffffff !important;
        }
        .top-info a {
            color: #ffffff !important;
        }

        /* Background màu đen cho Banner tiêu đề trang */
        .page-title-banner {
            background-color: #1a1a1a !important;
            color: #ffffff !important;
            border-bottom: 2px solid #333 !important;
        }
        .page-title-banner h2 {
            color: #ffffff !important;
            font-weight: 700 !important;
        }
        .page-title-banner .breadcrumb-item a {
            color: #ffc107 !important;
            text-decoration: none;
        }
        .page-title-banner .breadcrumb-item.active {
            color: #e0e0e0 !important;
        }
        .page-title-banner small {
            color: #cccccc !important;
        }

        /* Huy hiệu tình trạng sách cũ */
        .condition-badge {
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-weight: 600;
        }
        .badge-like-new { background-color: #198754; color: #fff; }
        .badge-very-good { background-color: #0d6efd; color: #fff; }
        .badge-good { background-color: #0dcaf0; color: #000; }
        .badge-acceptable { background-color: #ffc107; color: #000; }
        .badge-old { background-color: #6c757d; color: #fff; }

        .original-price { text-decoration: line-through; color: #888888; font-size: 0.9rem; }
        .selling-price { color: #dc3545; font-weight: 700; font-size: 1.15rem; }

        .book-card {
            border: 1px solid #e9ecef;
            border-radius: 10px;
            transition: all 0.25s ease-in-out;
            background: #fff;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .book-card:hover {
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            transform: translateY(-4px);
        }
        .book-img-wrap {
            position: relative;
            height: 260px;
            overflow: hidden;
            border-radius: 10px 10px 0 0;
            background: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .book-img-wrap img {
            max-height: 100%;
            max-width: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }
        .book-card:hover .book-img-wrap img {
            transform: scale(1.05);
        }
        .btn-wishlist {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255,255,255,0.9);
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-wishlist:hover {
            background: #fff;
            color: #dc3545;
        }
    </style>
</head>
<body class="bg-light">

    <!-- Header Fragment -->
    <div th:replace="~{fragments/header :: header}"></div>

    <!-- Flash Messages (Alerts) -->
    <div class="container mt-3">
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${infoMessage}" class="alert alert-info alert-dismissible fade show" role="alert">
            <i class="bi bi-info-circle-fill me-2"></i> <span th:text="${infoMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>

    <!-- Main Content Body -->
    <main th:replace="${content}"></main>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- Scripts -->
    <script th:src="@{/js/jquery-1.11.0.min.js}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper/swiper-bundle.min.js"></script>
    <script th:src="@{/js/script.js}"></script>

    <!-- Khởi tạo Bootstrap Dropdown đáng tin cậy -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            var dropdownElementList = [].slice.call(document.querySelectorAll('[data-bs-toggle="dropdown"]'));
            dropdownElementList.map(function (dropdownToggleEl) {
                return new bootstrap.Dropdown(dropdownToggleEl);
            });
        });
    </script>
</body>
</html>
