<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>Đặt Hàng Thành Công - Chuỗi Sách Cũ</title>
</head>
<body>
<div th:fragment="content">

    <div class="container py-5 text-center">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card border-0 shadow rounded-4 p-5 bg-white">
                    <div class="mb-3">
                        <i class="bi bi-check-circle-fill text-success display-1"></i>
                    </div>
                    <h2 class="fw-bold mb-2">Đặt Hàng Thành Công!</h2>
                    <p class="text-muted mb-4">Cảm ơn bạn đã lựa chọn mua sách cũ tại hệ thống chuỗi cửa hàng Bookly.</p>

                    <div class="bg-light p-3 rounded-3 mb-4 text-start" th:if="${order != null}">
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Mã đơn hàng:</span>
                            <b class="text-primary fs-6" th:text="${order.orderCode}">ORD2026-XXXX</b>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Phương thức thanh toán:</span>
                            <b th:text="${order.paymentMethod.label}">COD</b>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Trạng thái thanh toán:</span>
                            <span class="badge" th:classappend="${order.paymentStatus.name() == 'COMPLETED' ? 'bg-success' : 'bg-warning text-dark'}" 
                                  th:text="${order.paymentStatus.label}">Chờ thanh toán</span>
                        </div>
                        <div class="d-flex justify-content-between border-top pt-2 mt-2">
                            <span class="fw-bold">Tổng thanh toán:</span>
                            <b class="text-danger fs-5" th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT') + ' VNĐ'}">0 VNĐ</b>
                        </div>
                    </div>

                    <div class="d-flex gap-3 justify-content-center">
                        <a th:href="@{/user/orders}" class="btn btn-primary rounded-pill px-4 text-white">
                            <i class="bi bi-bag-check me-1"></i> Xem Danh Sách Đơn Mua
                        </a>
                        <a th:href="@{/}" class="btn btn-outline-secondary rounded-pill px-4">
                            Về Trang Chủ
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>
</body>
</html>
