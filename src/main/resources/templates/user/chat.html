<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tư Vấn Trực Tuyến - Chuỗi Cửa Hàng Sách Cũ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Inter:ital,opsz,wght@0,14..32,300..800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif !important;
            background: #f1f5f9; 
            -webkit-font-smoothing: antialiased;
        }
        .chat-container {
            height: calc(100vh - 120px);
            min-height: 550px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            overflow: hidden;
        }
        .shop-list-item {
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.2s ease;
        }
        .shop-list-item:hover {
            background: #f8fafc;
        }
        .shop-list-item.active {
            background: #e0f2fe;
            border-left: 4px solid #0284c7;
        }
        .messages-box {
            height: calc(100% - 140px);
            overflow-y: auto;
            padding: 20px;
            background: #f8fafc;
        }
        .msg-bubble {
            max-width: 75%;
            padding: 10px 16px;
            border-radius: 16px;
            margin-bottom: 12px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .msg-sent {
            background: #2563eb;
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }
        .msg-received {
            background: #ffffff;
            color: #1e293b;
            border: 1px solid #e2e8f0;
            margin-right: auto;
            border-bottom-left-radius: 4px;
        }
        .msg-time {
            font-size: 0.72rem;
            margin-top: 4px;
            opacity: 0.75;
        }
        .online-dot {
            width: 10px;
            height: 10px;
            background: #10b981;
            border-radius: 50%;
            display: inline-block;
        }
    </style>
</head>
<body>
<!-- Top Header -->
<nav class="navbar navbar-dark bg-dark px-4 py-2 shadow-sm">
    <div class="container-fluid d-flex justify-content-between align-items-center">
        <a class="navbar-brand d-flex align-items-center gap-2 fw-bold text-white" th:href="@{/}">
            <i class="bi bi-chat-quote-fill text-warning fs-4"></i>
            <span>TƯ VẤN SÁCH CŨ REALTIME <span class="badge bg-warning text-dark ms-1" style="font-size: 0.68rem;">LIVE STOMP</span></span>
        </a>
        <div class="d-flex align-items-center gap-3">
            <span class="text-white small d-none d-md-inline">
                Chào, <strong th:text="${currentUser.fullName}">Người dùng</strong>
            </span>
            <a th:href="@{/}" class="btn btn-outline-light btn-sm rounded-pill">
                <i class="bi bi-house me-1"></i> Trang Chủ
            </a>
        </div>
    </div>
</nav>

<div class="container my-4">
    <div class="row chat-container g-0">
        <!-- Sidebar Danh Sách Cửa Hàng / Chủ Tiệm -->
        <div class="col-md-4 col-lg-3 border-end p-3 d-flex flex-column h-100 bg-white">
            <div class="mb-3">
                <h6 class="fw-bold text-uppercase text-secondary small mb-2">
                    <i class="bi bi-shop me-1 text-primary"></i> Chi Nhánh Cửa Hàng
                </h6>
                <div class="text-muted small">Chọn tiệm sách để chat trực tiếp & xem tình trạng sách thật:</div>
            </div>

            <div class="overflow-y-auto flex-grow-1 pe-1" id="shopListContainer">
                <div th:each="shop, iterStat : ${shops}"
                     class="shop-list-item p-3 mb-2 border"
                     th:classappend="${iterStat.first ? 'active' : ''}"
                     th:attr="data-shop-id=${shop.id},
                              data-owner-id=${shop.owner != null ? shop.owner.id : 1},
                              data-shop-name=${shop.name},
                              data-owner-name=${shop.owner != null ? shop.owner.fullName : 'Chủ tiệm sách'}"
                     onclick="selectShop(this)">
                    <div class="d-flex align-items-center gap-2 mb-1">
                        <span class="online-dot"></span>
                        <strong class="text-dark text-truncate" th:text="${shop.name}">Hiệu Sách Cũ</strong>
                    </div>
                    <div class="small text-muted text-truncate">
                        <i class="bi bi-person me-1"></i><span th:text="${shop.owner != null ? shop.owner.fullName : 'Chủ Tiệm'}">Chủ quán</span>
                    </div>
                    <div class="small text-muted text-truncate">
                        <i class="bi bi-geo-alt me-1"></i><span th:text="${shop.address}">Hà Nội</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Cửa Sổ Khung Chat Trực Tuyến -->
        <div class="col-md-8 col-lg-9 d-flex flex-column h-100 bg-white">
            <!-- Chat Header -->
            <div class="p-3 border-bottom d-flex justify-content-between align-items-center bg-white">
                <div class="d-flex align-items-center gap-2">
                    <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center fw-bold" style="width: 42px; height: 42px;">
                        <i class="bi bi-shop"></i>
                    </div>
                    <div>
                        <h6 class="fw-bold mb-0 text-dark" id="currentChatTitle">Hiệu Sách Cũ</h6>
                        <small class="text-success fw-semibold"><span class="online-dot me-1"></span> Đang trực tuyến sẵn sàng tư vấn</small>
                    </div>
                </div>
                <div>
                    <span class="badge bg-light text-muted border">WebSocket STOMP: <span id="wsStatus" class="text-warning">Đang kết nối...</span></span>
                </div>
            </div>

            <!-- Messages Box -->
            <div class="messages-box" id="messagesBox">
                <div class="text-center text-muted small py-4" id="loadingNotice">
                    <div class="spinner-border spinner-border-sm text-primary mb-2" role="status"></div>
                    <div>Đang tải lịch sử trò chuyện...</div>
                </div>
            </div>

            <!-- Input Bar -->
            <div class="p-3 border-top bg-white">
                <form id="chatForm" onsubmit="handleSend(event)" class="d-flex gap-2">
                    <input type="text" id="messageInput" class="form-control rounded-pill px-4 py-2 border-secondary-subtle" 
                           placeholder="Hỏi về tình trạng sách cũ, chụp thêm ảnh bìa, giảm giá..." autocomplete="off">
                    <button type="submit" class="btn btn-primary rounded-pill px-4 fw-bold">
                        <i class="bi bi-send-fill me-1"></i> Gửi
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- SockJS & STOMP JS -->
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<script th:inline="javascript">
    /*<![CDATA[*/
    var currentUserId = /*[[${currentUser.id}]]*/ 1;
    var currentUserName = /*[[${currentUser.fullName}]]*/ 'User';
    var selectedReceiverId = null;
    var selectedShopName = '';
    var stompClient = null;

    // Khởi tạo kết nối STOMP
    function connectStomp() {
        var socket = new SockJS('/ws');
        stompClient = Stomp.over(socket);
        stompClient.debug = null; // Tắt log console spam

        stompClient.connect({}, function (frame) {
            document.getElementById('wsStatus').innerHTML = '<span class="text-success fw-bold">Đã kết nối</span>';
            console.log('Connected to WebSocket STOMP');

            // Subscribe topic chung
            stompClient.subscribe('/topic/messages', function (messageOutput) {
                var msg = JSON.parse(messageOutput.body);
                onMessageReceived(msg);
            });
        }, function (error) {
            document.getElementById('wsStatus').innerHTML = '<span class="text-danger">Mất kết nối</span>';
            console.error('STOMP error: ' + error);
            setTimeout(connectStomp, 5000); // Thử kết nối lại
        });
    }

    function selectShop(element) {
        document.querySelectorAll('.shop-list-item').forEach(el => el.classList.remove('active'));
        element.classList.add('active');

        selectedReceiverId = parseInt(element.getAttribute('data-owner-id'));
        selectedShopName = element.getAttribute('data-shop-name');

        document.getElementById('currentChatTitle').innerText = selectedShopName + ' (' + element.getAttribute('data-owner-name') + ')';
        loadChatHistory();
    }

    function loadChatHistory() {
        var box = document.getElementById('messagesBox');
        box.innerHTML = '<div class="text-center text-muted small py-4"><div class="spinner-border spinner-border-sm text-primary mb-2"></div><div>Đang tải lịch sử...</div></div>';

        if (!selectedReceiverId) return;

        fetch('/api/chat/history?user1Id=' + currentUserId + '&user2Id=' + selectedReceiverId)
            .then(res => res.json())
            .then(data => {
                box.innerHTML = '';
                if (data.length === 0) {
                    box.innerHTML = '<div class="text-center text-muted py-5"><i class="bi bi-chat-heart fs-2 d-block mb-2 text-primary opacity-50"></i>Bắt đầu cuộc trò chuyện với tiệm sách bằng lời chào đầu tiên!</div>';
                    return;
                }
                data.forEach(msg => appendMessage(msg));
                scrollToBottom();
            })
            .catch(err => {
                box.innerHTML = '<div class="text-center text-danger py-4">Không thể tải lịch sử trò chuyện.</div>';
            });
    }

    function handleSend(e) {
        e.preventDefault();
        var input = document.getElementById('messageInput');
        var text = input.value.trim();

        if (!text || !selectedReceiverId) return;

        var chatMessage = {
            senderId: currentUserId,
            senderName: currentUserName,
            receiverId: selectedReceiverId,
            content: text
        };

        if (stompClient && stompClient.connected) {
            stompClient.send("/app/chat.sendMessage", {}, JSON.stringify(chatMessage));
        } else {
            alert('Đang kết nối lại máy chủ chat, vui lòng thử lại trong giây lát.');
        }

        input.value = '';
    }

    function onMessageReceived(msg) {
        // Kiểm tra xem tin nhắn có thuộc cuộc hội thoại đang mở không
        var isForThisChat = (msg.senderId === currentUserId && msg.receiverId === selectedReceiverId) ||
                            (msg.senderId === selectedReceiverId && msg.receiverId === currentUserId);

        if (isForThisChat) {
            // Xóa thông báo rỗng nếu có
            var emptyNotice = document.querySelector('.messages-box .text-center');
            if (emptyNotice) emptyNotice.remove();

            appendMessage(msg);
            scrollToBottom();
        }
    }

    function appendMessage(msg) {
        var isMe = (msg.senderId === currentUserId);
        var box = document.getElementById('messagesBox');

        var div = document.createElement('div');
        div.className = 'msg-bubble ' + (isMe ? 'msg-sent' : 'msg-received');

        var senderLabel = isMe ? '' : '<div class="fw-bold small text-primary mb-1">' + msg.senderName + '</div>';
        div.innerHTML = senderLabel + '<div>' + escapeHtml(msg.content) + '</div><div class="msg-time text-end">' + (msg.sentAt || 'Vừa xong') + '</div>';

        box.appendChild(div);
    }

    function scrollToBottom() {
        var box = document.getElementById('messagesBox');
        box.scrollTop = box.scrollHeight;
    }

    function escapeHtml(text) {
        var map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
        return text.replace(/[&<>"']/g, function(m) { return map[m]; });
    }

    document.addEventListener("DOMContentLoaded", function() {
        connectStomp();
        var firstShop = document.querySelector('.shop-list-item');
        if (firstShop) {
            selectShop(firstShop);
        }
    });
    /*]]>*/
</script>
</body>
</html>
