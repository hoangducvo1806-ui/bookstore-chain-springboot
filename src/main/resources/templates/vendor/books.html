<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kênh Người Bán - Quản lý sách</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background:#f5f7fb; }
        .page-wrap { max-width:1200px; margin:36px auto; }
        .panel { background:white; border-radius:16px; padding:24px; box-shadow:0 4px 18px #18243b0b; }
        .book-img { width:54px;height:70px;object-fit:cover;border-radius:6px;background:#eee; }
        .table td,.table th { vertical-align:middle; }
    </style>
</head>
<body>
<!-- VENDOR PORTAL TOPBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4 py-2 mb-4 shadow-sm border-bottom border-warning">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2 fw-bold text-warning" th:href="@{/vendor/books}">
            <i class="bi bi-shop fs-4"></i>
            <span>KÊNH NGƯỜI BÁN <span class="badge bg-warning text-dark ms-1" style="font-size: 0.7rem;">VENDOR</span></span>
        </a>
        <div class="d-flex align-items-center gap-2">
            <a th:href="@{/}" target="_blank" class="btn btn-outline-light btn-sm rounded-pill">
                <i class="bi bi-globe me-1"></i> Xem Trang Mua Sách
            </a>
            <a th:href="@{/vendor/books}" class="btn btn-sm btn-outline-warning rounded-pill">
                <i class="bi bi-collection me-1"></i> Kho sách
            </a>
            <a th:href="@{/vendor/books/new}" class="btn btn-sm btn-warning rounded-pill fw-bold text-dark">
                <i class="bi bi-plus-circle me-1"></i> + Đăng sách
            </a>
            <a th:href="@{/logout}" class="btn btn-sm btn-outline-danger rounded-pill">
                <i class="bi bi-box-arrow-right me-1"></i> Đăng xuất
            </a>
        </div>
    </div>
</nav>
<div class="container page-wrap">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
            <h2 class="fw-bold mb-1">Quản lý sách</h2>
            <div class="text-secondary">Quản lý kho sách của cửa hàng bạn</div>
        </div>
        <a class="btn btn-primary" th:href="@{/vendor/books/new}">+ Thêm sách</a>
    </div>

    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <div class="panel">
        <form method="get" th:action="@{/vendor/books}" class="row g-2 mb-4">
            <div class="col-md-9">
                <input class="form-control" name="keyword" th:value="${keyword}"
                       placeholder="Tìm theo tên sách, tác giả hoặc ISBN...">
            </div>
            <div class="col-md-3 d-flex gap-2">
                <button class="btn btn-dark flex-fill" type="submit">Tìm kiếm</button>
                <a class="btn btn-outline-secondary" th:href="@{/vendor/books}">Xóa</a>
            </div>
        </form>

        <div class="table-responsive">
            <table class="table table-hover">
                <thead class="table-light">
                <tr>
                    <th>Sách</th>
                    <th>Danh mục</th>
                    <th>Giá bán</th>
                    <th>Tồn kho</th>
                    <th>Trạng thái</th>
                    <th style="min-width:160px">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="book : ${books}">
                    <td>
                        <div class="d-flex align-items-center gap-3">
                            <img class="book-img" th:if="${book.mainImageUrl != null and !book.mainImageUrl.isEmpty()}"
                                 th:src="${book.mainImageUrl}" alt="Bìa sách">
                            <div class="book-img d-flex align-items-center justify-content-center"
                                 th:unless="${book.mainImageUrl != null and !book.mainImageUrl.isEmpty()}">📚</div>
                            <div>
                                <div class="fw-semibold" th:text="${book.title}"></div>
                                <small class="text-secondary" th:text="${book.author}"></small>
                            </div>
                        </div>
                    </td>
                    <td th:text="${book.category.name}"></td>
                    <td th:text="${#numbers.formatDecimal(book.price, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                    <td th:text="${book.stock}"></td>
                    <td>
                        <span th:if="${book.active}" class="badge text-bg-success">Đang bán</span>
                        <span th:unless="${book.active}" class="badge text-bg-secondary">Đã ẩn</span>
                    </td>
                    <td>
                        <div class="d-flex gap-2">
                            <a class="btn btn-sm btn-outline-primary"
                               th:href="@{/vendor/books/{id}/edit(id=${book.id})}">Sửa</a>
                            <form method="post" th:action="@{/vendor/books/{id}/toggle(id=${book.id})}">
                                <button class="btn btn-sm btn-outline-secondary" type="submit"
                                        th:text="${book.active} ? 'Ẩn' : 'Bán lại'"></button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(books)}">
                    <td colspan="6" class="text-center text-secondary py-5">
                        Chưa có sách nào. Hãy chọn “Thêm sách” để bắt đầu.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2"
             th:if="${totalPages > 0}">
            <small class="text-secondary">
                Trang <span th:text="${currentPage + 1}"></span> /
                <span th:text="${totalPages}"></span>
            </small>
            <div class="d-flex gap-2">
                <a class="btn btn-sm btn-outline-dark"
                   th:if="${currentPage > 0}"
                   th:href="@{/vendor/books(page=${currentPage - 1},keyword=${keyword})}">Trước</a>
                <a class="btn btn-sm btn-outline-dark"
                   th:if="${currentPage + 1 < totalPages}"
                   th:href="@{/vendor/books(page=${currentPage + 1},keyword=${keyword})}">Sau</a>
            </div>
        </div>
    </div>
    <div class="mt-3">
        <a th:href="@{/}" class="text-decoration-none">← Về trang chủ</a>
    </div>
</div>
</body>
</html>
