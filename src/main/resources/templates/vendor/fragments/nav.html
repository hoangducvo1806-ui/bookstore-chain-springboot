<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>
<div th:fragment="vendorNav(activeNav)">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm py-2">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/vendor/dashboard}">
                <i class="bi bi-shop text-warning fs-4"></i>
                <div>
                    <span class="fw-bold text-white d-block" style="font-size: 1.1rem; line-height: 1.2;">KÊNH NGƯỜI BÁN</span>
                    <small class="text-white-50" th:text="${shop != null ? shop.name : 'Quản trị chi nhánh'}">Tên Shop</small>
                </div>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#vendorNavContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="vendorNavContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4 gap-lg-2">
                    <li class="nav-item">
                        <a class="nav-link px-3" th:classappend="${activeNav == 'dashboard' ? 'active text-warning fw-bold' : ''}" 
                           th:href="@{/vendor/dashboard}">
                            <i class="bi bi-speedometer2 me-1"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" th:classappend="${activeNav == 'books' ? 'active text-warning fw-bold' : ''}" 
                           th:href="@{/vendor/books}">
                            <i class="bi bi-book me-1"></i> Quản Lý Sách
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" th:classappend="${activeNav == 'orders' ? 'active text-warning fw-bold' : ''}" 
                           th:href="@{/vendor/orders}">
                            <i class="bi bi-receipt me-1"></i> Quản Lý Đơn Hàng
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" th:classappend="${activeNav == 'chat' ? 'active text-warning fw-bold' : ''}" 
                           th:href="@{/vendor/chat}">
                            <i class="bi bi-chat-dots-fill me-1"></i> Tin Nhắn Khách
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" th:classappend="${activeNav == 'profile' ? 'active text-warning fw-bold' : ''}" 
                           th:href="@{/vendor/shop/profile}">
                            <i class="bi bi-gear me-1"></i> Cấu Hình Shop
                        </a>
                    </li>
                </ul>

                <div class="d-flex align-items-center gap-3">
                    <!-- Real-time WebSocket connection badge -->
                    <span id="wsStatusBadge" class="badge rounded-pill bg-success-subtle text-success border border-success" 
                          title="Hệ thống thông báo Real-time đang hoạt động">
                        <i class="bi bi-broadcast me-1"></i> Realtime Online
                    </span>

                    <a th:href="@{/}" class="btn btn-outline-light btn-sm rounded-pill px-3" target="_blank">
                        <i class="bi bi-box-arrow-up-right me-1"></i> Xem Website
                    </a>

                    <div class="dropdown">
                        <a class="text-white text-decoration-none dropdown-toggle d-flex align-items-center" href="#" role="button" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle fs-5 me-1 text-warning"></i>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end shadow">
                            <li><a class="dropdown-item" th:href="@{/user/profile}"><i class="bi bi-person me-2"></i> Tài khoản cá nhân</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-danger" th:href="@{/logout}"><i class="bi bi-box-arrow-right me-2"></i> Đăng xuất</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Toast Container for Realtime Notifications -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1100;">
        <div id="liveOrderToast" class="toast border-0 shadow-lg" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header bg-primary text-white">
                <i class="bi bi-bell-fill me-2"></i>
                <strong class="me-auto">Thông Báo Đơn Hàng Realtime</strong>
                <small id="toastTime" class="text-white-50">Vừa xong</small>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body bg-white rounded-bottom">
                <div id="toastMessage" class="fw-semibold text-dark">Có thông báo mới!</div>
                <div class="mt-2 pt-2 border-top">
                    <a th:href="@{/vendor/orders}" class="btn btn-sm btn-outline-primary rounded-pill">Xem Danh Sách Đơn</a>
                </div>
            </div>
        </div>
    </div>

    <!-- SockJS and STOMP for Realtime WebSocket Notification -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        document.addEventListener("DOMContentLoaded", function () {
            var shopId = /*[[${shop != null ? shop.id : 0}]]*/ 0;
            var socket = new SockJS('/ws');
            var stompClient = Stomp.over(socket);
            stompClient.debug = null; // Tắt log verbose trong console

            stompClient.connect({}, function (frame) {
                var badge = document.getElementById('wsStatusBadge');
                if (badge) badge.className = 'badge rounded-pill bg-success-subtle text-success border border-success';

                // Lắng nghe broadcast toàn sàn
                stompClient.subscribe('/topic/orders', function (message) {
                    handleIncomingNotification(JSON.parse(message.body));
                });

                // Lắng nghe riêng cho shop của mình
                if (shopId > 0) {
                    stompClient.subscribe('/topic/shop/' + shopId, function (message) {
                        handleIncomingNotification(JSON.parse(message.body));
                    });
                }
            }, function (error) {
                var badge = document.getElementById('wsStatusBadge');
                if (badge) {
                    badge.className = 'badge rounded-pill bg-warning-subtle text-warning border border-warning';
                    badge.innerText = 'Realtime Offline';
                }
            });

            function handleIncomingNotification(data) {
                var toastEl = document.getElementById('liveOrderToast');
                if (toastEl && data) {
                    document.getElementById('toastMessage').innerText = data.message || ('Đơn hàng ' + data.orderCode + ': ' + data.statusLabel);
                    document.getElementById('toastTime').innerText = data.time || 'Vừa xong';
                    var bsToast = new bootstrap.Toast(toastEl, { delay: 8000 });
                    bsToast.show();
                }
            }
        });
        /*]]>*/
    </script>
</div>
</body>
</html>
