<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cấu Hình Cửa Hàng - Kênh Người Bán</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background: #f4f6fa; font-family: system-ui, -apple-system, sans-serif; }
        .panel { background: white; border-radius: 14px; padding: 28px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); }
    </style>
</head>
<body>

<div th:replace="~{vendor/fragments/nav :: vendorNav('profile')}"></div>

<div class="container py-4" style="max-width: 860px;">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold mb-0">⚙️ Cấu Hình Thông Tin Cửa Hàng</h3>
            <small class="text-muted">Chỉnh sửa thông tin nhận diện, liên hệ và hình ảnh của shop</small>
        </div>
        <a th:href="@{/vendor/dashboard}" class="btn btn-outline-secondary btn-sm rounded-pill">
            <i class="bi bi-arrow-left me-1"></i> Về Dashboard
        </a>
    </div>

    <!-- Alerts -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <form class="panel" th:action="@{/vendor/shop/profile}" th:object="${shopDto}" method="post" enctype="multipart/form-data">
        
        <h5 class="fw-bold text-primary border-bottom pb-2 mb-3">
            <i class="bi bi-info-circle me-1"></i> Thông Tin Cơ Bản
        </h5>

        <div class="row g-3 mb-4">
            <div class="col-md-7">
                <label for="name" class="form-label fw-semibold">Tên Cửa Hàng <span class="text-danger">*</span></label>
                <input type="text" id="name" th:field="*{name}" class="form-control" required maxlength="150">
                <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>
            <div class="col-md-5">
                <label for="phone" class="form-label fw-semibold">Hotline Liên Hệ <span class="text-danger">*</span></label>
                <input type="text" id="phone" th:field="*{phone}" class="form-control" required maxlength="20">
                <div class="text-danger small" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
            </div>

            <div class="col-12">
                <label for="address" class="form-label fw-semibold">Địa Chỉ Chi Nhánh <span class="text-danger">*</span></label>
                <input type="text" id="address" th:field="*{address}" class="form-control" required maxlength="255">
                <div class="text-danger small" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
            </div>

            <div class="col-12">
                <label for="bio" class="form-label fw-semibold">Tiểu Sử / Khẩu Hiệu Ngắn (Bio)</label>
                <input type="text" id="bio" th:field="*{bio}" class="form-control" 
                       placeholder="Ví dụ: Hiệu sách cũ chuyên tác phẩm văn học quý hiếm và truyện tranh cổ..." maxlength="500">
            </div>

            <div class="col-12">
                <label for="description" class="form-label fw-semibold">Mô Tả Chi Tiết Gian Hàng</label>
                <textarea id="description" th:field="*{description}" class="form-control" rows="4"></textarea>
            </div>
        </div>

        <h5 class="fw-bold text-primary border-bottom pb-2 mb-3">
            <i class="bi bi-images me-1"></i> Cập Nhật Hình Ảnh Nhận Diện (Cloudinary)
        </h5>

        <div class="row g-3 mb-4">
            <div class="col-md-6">
                <label class="form-label fw-semibold">Logo Cửa Hàng (Thay mới)</label>
                <div th:if="${shop.logoUrl != null and !shop.logoUrl.isEmpty()}" class="mb-2">
                    <img th:src="${shop.logoUrl}" class="rounded border p-1" style="width: 70px; height: 70px; object-fit: cover;">
                </div>
                <input type="file" name="logoFile" class="form-control" accept="image/*">
            </div>
            <div class="col-md-6">
                <label class="form-label fw-semibold">Ảnh Bìa / Banner (Thay mới)</label>
                <div th:if="${shop.bannerUrl != null and !shop.bannerUrl.isEmpty()}" class="mb-2">
                    <img th:src="${shop.bannerUrl}" class="rounded border p-1" style="width: 140px; height: 70px; object-fit: cover;">
                </div>
                <input type="file" name="bannerFile" class="form-control" accept="image/*">
            </div>
        </div>

        <div class="d-flex justify-content-end gap-3">
            <a th:href="@{/vendor/dashboard}" class="btn btn-outline-secondary px-4 rounded-pill">Hủy Bỏ</a>
            <button type="submit" class="btn btn-primary px-5 rounded-pill fw-bold text-white shadow-sm">
                <i class="bi bi-check-circle me-1"></i> Lưu Cấu Hình Shop
            </button>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
