<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle}">Thông tin sách</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Inter:ital,opsz,wght@0,14..32,300..800;1,14..32,300..800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif !important;
            background:#f5f7fb; 
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .page-wrap { max-width:900px;margin:32px auto; }
        .panel { background:white;border-radius:16px;padding:28px;box-shadow:0 4px 18px #18243b0b; }
        label { font-weight:600;margin-bottom:6px; }
    </style>
</head>
<body>
<!-- VENDOR PORTAL TOPBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4 py-2 mb-4 shadow-sm border-bottom border-warning">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2 fw-bold text-warning" th:href="@{/vendor/books}">
            <i class="bi bi-shop fs-4"></i>
            <span>KÊNH NGƯỜI BÁN <span class="badge bg-warning text-dark ms-1" style="font-size: 0.7rem;">VENDOR</span></span>
        </a>
        <div class="d-flex align-items-center gap-2">
            <a th:href="@{/}" target="_blank" class="btn btn-outline-light btn-sm rounded-pill">
                <i class="bi bi-globe me-1"></i> Trang Chủ
            </a>
            <a th:href="@{/vendor/books}" class="btn btn-sm btn-outline-warning rounded-pill">
                <i class="bi bi-collection me-1"></i> Kho sách
            </a>
            <a th:href="@{/vendor/orders}" class="btn btn-sm btn-outline-warning rounded-pill">
                <i class="bi bi-box-seam me-1"></i> Đơn hàng
            </a>
            <a th:href="@{/vendor/revenue}" class="btn btn-sm btn-outline-warning rounded-pill">
                <i class="bi bi-graph-up me-1"></i> Doanh thu
            </a>
            <a th:href="@{/chat}" class="btn btn-sm btn-outline-info rounded-pill">
                <i class="bi bi-chat-dots me-1"></i> Tin nhắn
            </a>
            <a th:href="@{/vendor/books/new}" class="btn btn-sm btn-warning rounded-pill fw-bold text-dark">
                <i class="bi bi-plus-circle me-1"></i> + Đăng sách
            </a>
            <a th:href="@{/logout}" class="btn btn-sm btn-outline-danger rounded-pill">
                <i class="bi bi-box-arrow-right me-1"></i> Đăng xuất
            </a>
        </div>
    </div>
</nav>
<div class="container page-wrap">
    <div class="mb-4">
        <h2 class="fw-bold" th:text="${pageTitle}"></h2>
        <p class="text-secondary mb-0">Nhập thông tin sách bên dưới.</p>
    </div>

    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <form class="panel" method="post" th:action="@{/vendor/books/save}" th:object="${book}">
        <input type="hidden" th:field="*{id}">

        <div class="row g-3">
            <div class="col-md-8">
                <label for="title">Tên sách *</label>
                <input id="title" class="form-control" th:field="*{title}" required maxlength="255">
            </div>
            <div class="col-md-4">
                <label for="categoryId">Danh mục *</label>
                <select id="categoryId" name="categoryId" class="form-select" required>
                    <option value="">-- Chọn danh mục --</option>
                    <option th:each="cat : ${categories}" th:value="${cat.id}"
                            th:text="${cat.name}" th:selected="${categoryId != null and categoryId == cat.id}"></option>
                </select>
            </div>

            <div class="col-md-6">
                <label for="author">Tác giả *</label>
                <input id="author" class="form-control" th:field="*{author}" required maxlength="150">
            </div>
            <div class="col-md-6">
                <label for="publisher">Nhà xuất bản</label>
                <input id="publisher" class="form-control" th:field="*{publisher}" maxlength="150">
            </div>

            <div class="col-md-4">
                <label for="isbn">ISBN</label>
                <input id="isbn" class="form-control" th:field="*{isbn}" maxlength="50">
            </div>
            <div class="col-md-4">
                <label for="publishYear">Năm xuất bản</label>
                <input id="publishYear" type="number" class="form-control"
                       th:field="*{publishYear}" min="0" max="2100">
            </div>
            <div class="col-md-4">
                <label for="bookCondition">Tình trạng sách *</label>
                <select id="bookCondition" class="form-select" th:field="*{bookCondition}" required>
                    <option value="">-- Chọn tình trạng --</option>
                    <option th:each="condition : ${conditions}" th:value="${condition}"
                            th:text="${condition.label}"></option>
                </select>
            </div>

            <div class="col-md-4">
                <label for="originalPrice">Giá bìa (VNĐ) *</label>
                <input id="originalPrice" type="number" step="0.01" min="0"
                       class="form-control" th:field="*{originalPrice}" required>
            </div>
            <div class="col-md-4">
                <label for="price">Giá bán (VNĐ) *</label>
                <input id="price" type="number" step="0.01" min="0"
                       class="form-control" th:field="*{price}" required>
            </div>
            <div class="col-md-4">
                <label for="stock">Số lượng tồn kho *</label>
                <input id="stock" type="number" min="0" class="form-control"
                       th:field="*{stock}" required>
            </div>

            <div class="col-12">
                <label for="mainImageUrl">Ảnh bìa chính (URL)</label>
                <input id="mainImageUrl" class="form-control" th:field="*{mainImageUrl}"
                       maxlength="500" placeholder="https://...">
            </div>
            <div class="col-12">
                <label for="imageUrls">URL ảnh bổ sung</label>
                <textarea id="imageUrls" name="imageUrls" class="form-control" rows="3"
                          th:text="${imageUrls}"
                          placeholder="Mỗi URL một dòng hoặc phân cách bằng dấu phẩy"></textarea>
                <small class="text-secondary">Nhập URL ảnh đã tải lên. Ô này chưa tự tải file lên Cloudinary.</small>
            </div>

            <div class="col-12">
                <label for="conditionNote">Ghi chú tình trạng</label>
                <textarea id="conditionNote" class="form-control" rows="2"
                          th:field="*{conditionNote}"></textarea>
            </div>
            <div class="col-12">
                <label for="description">Mô tả sách</label>
                <textarea id="description" class="form-control" rows="4"
                          th:field="*{description}"></textarea>
            </div>
        </div>

        <div class="d-flex justify-content-end gap-2 mt-4">
            <a class="btn btn-outline-secondary" th:href="@{/vendor/books}">Hủy</a>
            <button class="btn btn-primary" type="submit">Lưu sách</button>
        </div>
    </form>
</div>
</body>
</html>
