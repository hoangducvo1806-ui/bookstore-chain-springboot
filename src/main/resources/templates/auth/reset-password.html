<!DOCTYPE html>
<html lang="vi" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đặt lại mật khẩu - Chuỗi Sách Cũ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Inter:ital,opsz,wght@0,14..32,300..800;1,14..32,300..800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif !important;
            background-color: #0b0d11 !important; 
            color: #f3f4f6; 
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .card { background-color: #141720 !important; border: 1px solid #242937 !important; }
        .form-control { background-color: #171b26 !important; border-color: #272d3b !important; color: #f3f4f6 !important; }
        .form-control:focus { border-color: #3b82f6 !important; }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-body p-4">
                    <h3 class="card-title text-center fw-bold mb-3 text-white">🔑 Đặt Lại Mật Khẩu</h3>
                    <p class="text-secondary text-center small mb-4">Nhập mã OTP vừa nhận qua Email và mật khẩu mới của bạn</p>

                    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
                    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

                    <form th:action="@{/reset-password}" method="post">
                        <div class="mb-3">
                            <label class="form-label text-light">Email tài khoản</label>
                            <input type="email" name="email" class="form-control" th:value="${email}" required readonly>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-light">Mã OTP (6 chữ số gửi qua email)</label>
                            <input type="text" name="otpCode" class="form-control text-center fs-4 fw-bold" placeholder="123456" maxlength="6" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-light">Mật khẩu mới (từ 6 ký tự)</label>
                            <input type="password" name="newPassword" class="form-control" placeholder="••••••••" minlength="6" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-bold">
                            <i class="bi bi-shield-check me-1"></i> Xác Nhận Đặt Lại Mật Khẩu
                        </button>
                    </form>

                    <div class="text-center mt-4 text-muted small">
                        <span>Nhớ lại mật khẩu? </span>
                        <a th:href="@{/login}" class="text-primary text-decoration-none fw-semibold">Đăng nhập</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
