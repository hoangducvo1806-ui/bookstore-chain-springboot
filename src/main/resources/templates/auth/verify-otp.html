<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Xác thực mã OTP - Chuỗi Sách Cũ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,300..900;1,300..900&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif !important;
            background-color: #f8f9fa;
        }
        h1, h2, h3, h4, h5, h6 {
            text-transform: none !important;
        }
    </style>
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-body p-4">
                    <h3 class="card-title text-center fw-bold mb-4">🔑 Nhập Mã OTP</h3>

                    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
                    <div th:if="${successMessage}" class="alert alert-info" th:text="${successMessage}"></div>

                    <form th:action="@{/verify-otp}" th:object="${verifyOtpRequest}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Email tài khoản</label>
                            <input type="email" class="form-control" th:field="*{email}" readonly required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Mã OTP (6 chữ số gửi qua Email)</label>
                            <input type="text" class="form-control text-center fs-4 fw-bold" th:field="*{otpCode}" placeholder="123456" maxlength="6" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2">Xác Nhận & Kích Hoạt</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
