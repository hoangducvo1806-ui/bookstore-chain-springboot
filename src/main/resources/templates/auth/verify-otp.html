<!DOCTYPE html>
<html lang="vi" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Xác thực mã OTP - Chuỗi Sách Cũ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Inter:ital,opsz,wght@0,14..32,300..800;1,14..32,300..800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif !important;
            background-color: #0b0d11 !important; 
            color: #f3f4f6; 
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .card { background-color: #141720 !important; border: 1px solid #242937 !important; }
        .form-control { background-color: #171b26 !important; border-color: #272d3b !important; color: #f3f4f6 !important; }
        .form-control:focus { border-color: #3b82f6 !important; }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-body p-4">
                    <h3 class="card-title text-center fw-bold mb-4 text-white">🔑 Nhập Mã OTP</h3>

                    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
                    <div th:if="${successMessage}" class="alert alert-info" th:text="${successMessage}"></div>

                    <form th:action="@{/verify-otp}" th:object="${verifyOtpRequest}" method="post">
                        <div class="mb-3">
                            <label class="form-label text-light">Email tài khoản</label>
                            <input type="email" class="form-control" th:field="*{email}" readonly required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-light">Mã OTP (6 chữ số gửi qua Email)</label>
                            <input type="text" class="form-control text-center fs-4 fw-bold" th:field="*{otpCode}" placeholder="123456" maxlength="6" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-bold">Xác Nhận & Kích Hoạt</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
