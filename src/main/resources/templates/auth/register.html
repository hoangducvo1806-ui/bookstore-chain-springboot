<!DOCTYPE html>
<html lang="vi" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng ký tài khoản - Chuỗi Sách Cũ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0b0d11 !important; color: #f3f4f6; }
        .card { background-color: #141720 !important; border: 1px solid #242937 !important; }
        .form-control { background-color: #171b26 !important; border-color: #272d3b !important; color: #f3f4f6 !important; }
        .form-control:focus { border-color: #3b82f6 !important; }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-body p-4">
                    <h3 class="card-title text-center fw-bold mb-4 text-white">📝 Đăng Ký Tài Khoản</h3>

                    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

                    <form th:action="@{/register}" th:object="${registerRequest}" method="post">
                        <div class="mb-3">
                            <label class="form-label text-light">Họ và tên</label>
                            <input type="text" class="form-control" th:field="*{fullName}" placeholder="Nguyễn Văn A" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-light">Email</label>
                            <input type="email" class="form-control" th:field="*{email}" placeholder="name@example.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-light">Số điện thoại</label>
                            <input type="tel" class="form-control" th:field="*{phone}" placeholder="0901234567">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-light">Mật khẩu (từ 6 ký tự)</label>
                            <input type="password" class="form-control" th:field="*{password}" placeholder="••••••••" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-bold">Nhận Mã OTP Kích Hoạt</button>
                    </form>

                    <div class="text-center mt-3 text-muted">
                        <span>Đã có tài khoản? </span>
                        <a th:href="@{/login}" class="text-primary text-decoration-none">Đăng nhập</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
